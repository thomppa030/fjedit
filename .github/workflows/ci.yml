name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each job builds fjedit as someone cloning it gets it, with ftk fetched at the
# commit CMakeLists.txt names, and runs the five test suites. The tests against
# a real clangd run where the runner has one, which is Windows; fjls's skip.
jobs:
  linux:
    name: Linux (Ninja, GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/linux-toolchain

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: deps-linux-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset debug

      # Keeps going past a file that fails, so one run lists every file
      # that does rather than only the first.
      - name: Build
        run: cmake --build --preset debug -- -k 0

      - name: Test
        run: ctest --preset debug

  # The tests under AddressSanitizer and UndefinedBehaviorSanitizer: a read of
  # freed memory or undefined behaviour fails the run here, where the other
  # jobs pass whenever the freed memory still happens to hold the old value.
  linux-asan:
    name: Linux ASan (Ninja, GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/linux-toolchain

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build-asan/_deps
          key: deps-linux-asan-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan -- -k 0

      - name: Test
        run: ctest --preset asan

  windows:
    name: Windows (Ninja, MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      # Puts cl.exe and the MSVC toolchain on PATH so the Ninja generator
      # finds them without a Visual Studio developer prompt.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true
          install_runtime: false
          # Keeps glslc, which ftk's build compiles its shaders with.
          stripdown: false

      - uses: lukka/get-cmake@v4.4.0
        with:
          cmakeVersion: "4.4.0"

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: deps-windows-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset debug

      # Keeps going past a file that fails, so one run lists every file
      # that does rather than only the first.
      - name: Build
        run: cmake --build --preset debug -- -k 0

      - name: Test
        run: ctest --preset debug
